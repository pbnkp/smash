<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smash</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e0f2fe;font:14px/1.4 ui-sans-serif,system-ui,sans-serif}
  body{display:grid;place-items:center}
  svg{width:min(92vw,640px);height:auto;display:block}
  p{margin:10px 16px 0;text-align:center;color:#94a3b8}
  @media (prefers-reduced-motion: reduce){
    #core,#trail{animation:none}
    #core{transform:translate(210px,0)}
    #trail{opacity:.85}
  }
</style>
</head>
<body>
<svg viewBox="0 0 640 280" role="img" aria-label="Smash graphic">
  <rect width="640" height="280" fill="#000"/>
  <g id="trail">
    <line x1="24" y1="140" x2="250" y2="140" stroke="url(#trail)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="x2" values="120;420;120" dur="2.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g id="core">
    <animateTransform attributeName="transform" type="translate" values="80 0;250 0;80 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="150" cy="140" r="70" fill="#0369a1" opacity=".45"/>
    <circle cx="150" cy="140" r="54" fill="url(#glow)"/>
  </g>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="22%" stop-color="#38bdf8"/>
      <stop offset="62%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
</svg>
<p>Smash v6.1 · plays here, and the same mark plays in the Mac app, TimeDrive, and SnoutSession.</p>
</body>
</html>
